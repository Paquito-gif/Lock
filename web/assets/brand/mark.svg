<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="70%">
      <stop offset="0" stop-color="#3a1206"/>
      <stop offset=".45" stop-color="#140707"/>
      <stop offset="1" stop-color="#07050a"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b625c"/>
      <stop offset=".35" stop-color="#e8e2dc"/>
      <stop offset=".55" stop-color="#a39a93"/>
      <stop offset="1" stop-color="#4e4743"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset=".3" stop-color="#ffb04a"/>
      <stop offset=".7" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#b8280e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6" stop-opacity=".9"/>
      <stop offset=".12" stop-color="#fff3d6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#ff7a2a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="600" r="380" fill="url(#halo)"/>
  <!-- shackle -->
  <path d="M362 478 V372 A150 150 0 0 1 662 372 V478" fill="none" stroke="url(#steel)" stroke-width="74" stroke-linecap="butt"/>
  <!-- body -->
  <g filter="url(#glow)">
    <rect x="262" y="458" width="500" height="390" rx="78" fill="url(#ember)"/>
  </g>
  <rect x="262" y="458" width="500" height="390" rx="78" fill="url(#rim)"/>
  <!-- keyhole shaped as a flame -->
  <path d="M512 538 C552 590 600 628 600 694 C600 748 560 786 512 786 C464 786 424 748 424 694 C424 662 440 638 462 618 C462 650 476 670 494 676 C484 628 494 580 512 538 Z" fill="#1a0702"/>
  <path d="M512 640 C530 664 548 682 548 712 C548 738 532 754 512 754 C492 754 476 738 476 712 C476 694 486 680 496 672 C498 690 504 700 512 702 C506 680 506 660 512 640 Z" fill="#ff8a3d" opacity=".9"/>
</svg>
